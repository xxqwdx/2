name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 定位工程目录
        run: |
          mkdir -p w
          BEST=""; SIZE=0
          for Z in *.zip; do
            [ -e "$Z" ] || continue
            D="w/$(basename "$Z" .zip)"
            unzip -qo "$Z" -d "$D" 2>/dev/null || continue
            P=$(find "$D" -maxdepth 4 -name settings.gradle -printf '%h\n' | head -1)
            [ -n "$P" ] && [ -f "$P/app/build.gradle" ] || continue
            N=$(wc -c < "$P/app/src/main/assets/index.html" 2>/dev/null || echo 0)
            if [ "$N" -gt "$SIZE" ]; then SIZE=$N; BEST=$P; fi
          done
          [ -z "$BEST" ] && echo "未找到可用工程" && exit 1
          echo "PROJECT_DIR=$(cd "$BEST" && pwd)" >> "$GITHUB_ENV"
          echo "选用工程: $BEST (index.html $SIZE 字节)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装SDK与Gradle
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/g"
          echo "$HOME/g/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: 构建APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wagecalc-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
